<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Flipbook (1:1 Square)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 3D Book Container Setup with strict 1:1 Square Aspect Ratio */
        .book-viewport {
            perspective: 2000px;
            transform-style: preserve-3d;
        }

        .book {
            position: relative;
            width: min(75vw, 70vh);
            height: min(75vw, 70vh); /* Enforces exact 1:1 square ratio */
            aspect-ratio: 1 / 1;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            pointer-events: none;
        }

        .page.active {
            pointer-events: auto;
        }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            background: #ffffff;
            border-radius: 4px;
        }

        .page-face.front {
            z-index: 2;
        }

        .page-face.back {
            transform: rotateY(180deg);
            z-index: 1;
            box-shadow: inset 20px 0 30px rgba(0,0,0,0.15);
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Spine shadow overlay during flip */
        .page-face::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.2) 0%, transparent 10%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .page.flipped .page-face.front::after {
            opacity: 1;
        }

        img.page-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures 1:1 image fits cleanly without distortion */
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Custom scrollbar & UI Polish */
        input[type="range"] {
            accent-color: #6366f1;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen text-slate-100 select-none">

    <!-- Header / Title -->
    <header class="w-full py-4 px-6 flex items-center justify-between bg-slate-900/60 backdrop-blur-md border-b border-slate-800 z-30">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-book-open text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Interactive 3D Flipbook</h1>
                <p class="text-xs text-slate-400">1:1 Square Format • 18 Pages Animation Loop</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div id="loading-badge" class="hidden px-3 py-1 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-full text-xs font-medium animate-pulse">
                <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Preloading Images...
            </div>
            <div id="loaded-badge" class="px-3 py-1 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-full text-xs font-medium flex items-center">
                <i class="fa-solid fa-circle-check mr-1.5"></i> Ready (18/18)
            </div>
        </div>
    </header>

    <!-- Main Book Stage -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        <!-- Book Viewport -->
        <div class="book-viewport flex items-center justify-center">
            <div class="book" id="bookElement">
                <!-- Pages will be dynamically generated here -->
            </div>
        </div>

        <!-- Floating Quick Nav Hint -->
        <div class="mt-6 text-xs text-slate-400 tracking-wide flex items-center space-x-4 bg-slate-900/40 px-4 py-2 rounded-full border border-slate-800/80 backdrop-blur-sm">
            <span><i class="fa-solid fa-arrow-left text-indigo-400 mr-1"></i> <i class="fa-solid fa-arrow-right text-indigo-400 mr-1"></i> Use Arrow Keys</span>
            <span>•</span>
            <span><i class="fa-solid fa-computer-mouse text-indigo-400 mr-1"></i> Click or Drag to Flip</span>
        </div>
    </main>

    <!-- Control Panel -->
    <footer class="w-full bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 py-4 px-6 z-30 shadow-2xl">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Page Slider & Indicator -->
            <div class="flex items-center space-x-3 w-full md:w-auto justify-center">
                <span id="currentPageLabel" class="text-xs font-semibold text-indigo-400 w-16 text-right">Page 1 / 18</span>
                <input type="range" id="pageSlider" min="1" max="18" value="1" class="w-40 md:w-48 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <span class="text-xs font-medium text-slate-400 w-8">18</span>
            </div>

            <!-- Playback & Navigation Controls -->
            <div class="flex items-center space-x-2">
                <button id="firstBtn" title="First Page" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition border border-slate-700 shadow-sm">
                    <i class="fa-solid fa-backward-step text-xs"></i>
                </button>
                <button id="prevBtn" title="Previous Page" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition border border-slate-700 shadow-sm">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button id="playPauseBtn" title="Play / Pause Auto Animation" class="px-5 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium flex items-center space-x-2 transition shadow-lg shadow-indigo-600/30">
                    <i id="playPauseIcon" class="fa-solid fa-play text-xs"></i>
                    <span id="playPauseText" class="text-xs">Auto Play</span>
                </button>
                <button id="nextBtn" title="Next Page" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition border border-slate-700 shadow-sm">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <button id="lastBtn" title="Last Page" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition border border-slate-700 shadow-sm">
                    <i class="fa-solid fa-forward-step text-xs"></i>
                </button>
            </div>

            <!-- Speed Control -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400"><i class="fa-solid fa-gauge-high mr-1 text-indigo-400"></i> Speed:</span>
                <select id="speedSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2 outline-none focus:border-indigo-500 transition cursor-pointer">
                    <option value="4000">Slow (4s)</option>
                    <option value="2500" selected>Normal (2.5s)</option>
                    <option value="1500">Fast (1.5s)</option>
                    <option value="800">Turbo (0.8s)</option>
                </select>
            </div>

        </div>
    </footer>

    <!-- Script Application Logic -->
    <script>
        // Image List in correct order from page 1 to 18
        const imageUrls = [
            "https://i.ibb.co/Y4SCRMhX/1.png",
            "https://i.ibb.co/7xjbff49/2.png",
            "https://i.ibb.co/Hfykd9wK/3.png",
            "https://i.ibb.co/3y7k21hd/4.png",
            "https://i.ibb.co/F4FxT2Rk/5.png",
            "https://i.ibb.co/KcmWTGHz/6.png",
            "https://i.ibb.co/KxPHM8BY/7.png",
            "https://i.ibb.co/Mx7QXR0s/8.png",
            "https://i.ibb.co/tpQ8pBCh/9.png",
            "https://i.ibb.co/nspRVfkd/10.png",
            "https://i.ibb.co/vgbmZxQ/11.png",
            "https://i.ibb.co/C3KfjQW6/12.png",
            "https://i.ibb.co/MxPSkK23/13.png",
            "https://i.ibb.co/d4wTSFfS/14.png",
            "https://i.ibb.co/rGJksNwH/15.png",
            "https://i.ibb.co/PvLYWsy2/16.png",
            "https://i.ibb.co/FqDv811M/17.png",
            "https://i.ibb.co/B5fnS0sL/18.png"
        ];

        let currentPageIndex = 0; // 0-based index (0 to 17)
        const totalPages = imageUrls.length;
        let isPlaying = false;
        let autoPlayInterval = null;
        let intervalTime = 2500; // default 2.5s
        let preloadedImages = [];

        // DOM Elements
        const bookElement = document.getElementById('bookElement');
        const pageSlider = document.getElementById('pageSlider');
        const currentPageLabel = document.getElementById('currentPageLabel');
        const firstBtn = document.getElementById('firstBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const lastBtn = document.getElementById('lastBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');
        const speedSelect = document.getElementById('speedSelect');
        const loadingBadge = document.getElementById('loading-badge');
        const loadedBadge = document.getElementById('loaded-badge');

        // Preload all 18 images smoothly to prevent lag
        function preloadImages() {
            loadingBadge.classList.remove('hidden');
            loadedBadge.classList.add('hidden');
            let loadedCount = 0;

            imageUrls.forEach((url, idx) => {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === totalPages) {
                        loadingBadge.classList.add('hidden');
                        loadedBadge.classList.remove('hidden');
                    }
                };
                img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalPages) {
                        loadingBadge.classList.add('hidden');
                        loadedBadge.classList.remove('hidden');
                    }
                };
                preloadedImages[idx] = img;
            });
        }

        // Build the Book DOM Structure
        function buildBook() {
            bookElement.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const page = document.createElement('div');
                page.className = `page ${i < currentPageIndex ? 'flipped' : ''}`;
                page.style.zIndex = totalPages - i;
                page.dataset.index = i;

                const frontFace = document.createElement('div');
                frontFace.className = 'page-face front';
                const frontImg = document.createElement('img');
                frontImg.className = 'page-image';
                frontImg.src = imageUrls[i];
                frontImg.alt = `Page ${i + 1}`;
                frontFace.appendChild(frontImg);

                const backFace = document.createElement('div');
                backFace.className = 'page-face back';
                const backImg = document.createElement('img');
                backImg.className = 'page-image';
                backImg.src = (i + 1 < totalPages) ? imageUrls[i + 1] : imageUrls[i];
                backImg.alt = `Page Back ${i + 1}`;
                backFace.appendChild(backImg);

                page.appendChild(frontFace);
                page.appendChild(backFace);

                // Click on page to flip forward/backward
                page.addEventListener('click', (e) => {
                    const rect = page.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    if (clickX > rect.width / 2) {
                        goToPage(currentPageIndex + 1);
                    } else {
                        goToPage(currentPageIndex - 1);
                    }
                });

                bookElement.appendChild(page);
            }
            updateUIState();
        }

        // Update visual page states and UI labels without rebuilding DOM
        function updateBookState() {
            const pages = bookElement.querySelectorAll('.page');
            pages.forEach((page, idx) => {
                if (idx < currentPageIndex) {
                    page.classList.add('flipped');
                } else {
                    page.classList.remove('flipped');
                }
            });
            updateUIState();
        }

        function updateUIState() {
            currentPageLabel.textContent = `Page ${currentPageIndex + 1} / ${totalPages}`;
            pageSlider.value = currentPageIndex + 1;
        }

        // Navigation Actions
        function goToPage(targetIndex) {
            if (targetIndex < 0) {
                targetIndex = totalPages - 1; 
            } else if (targetIndex >= totalPages) {
                targetIndex = 0;
            }
            currentPageIndex = targetIndex;
            updateBookState();
        }

        // Auto Animation Toggle & Loop handler
        function togglePlayPause() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseIcon.className = "fa-solid fa-pause text-xs";
                playPauseText.textContent = "Pause Auto";
                playPauseBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
                playPauseBtn.classList.add('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');
                
                startAutoPlay();
            } else {
                stopAutoPlay();
            }
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(() => {
                let nextIdx = currentPageIndex + 1;
                if (nextIdx >= totalPages) {
                    nextIdx = 0; // seamless continuous loop
                }
                goToPage(nextIdx);
            }, intervalTime);
        }

        function stopAutoPlay() {
            isPlaying = false;
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            playPauseIcon.className = "fa-solid fa-play text-xs";
            playPauseText.textContent = "Auto Play";
            playPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500', 'shadow-amber-600/30');
            playPauseBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
        }

        // Event Listeners Setup
        function initEvents() {
            firstBtn.addEventListener('click', () => { stopAutoPlay(); goToPage(0); });
            lastBtn.addEventListener('click', () => { stopAutoPlay(); goToPage(totalPages - 1); });
            prevBtn.addEventListener('click', () => { stopAutoPlay(); goToPage(currentPageIndex - 1); });
            nextBtn.addEventListener('click', () => { stopAutoPlay(); goToPage(currentPageIndex + 1); });
            playPauseBtn.addEventListener('click', togglePlayPause);

            pageSlider.addEventListener('input', (e) => {
                stopAutoPlay();
                goToPage(parseInt(e.target.value) - 1);
            });

            speedSelect.addEventListener('change', (e) => {
                intervalTime = parseInt(e.target.value);
                if (isPlaying) {
                    startAutoPlay();
                }
            });

            // Keyboard support (Arrow Left / Arrow Right)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    stopAutoPlay();
                    goToPage(currentPageIndex + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    stopAutoPlay();
                    goToPage(currentPageIndex - 1);
                } else if (e.key === ' ') {
                    e.preventDefault();
                    togglePlayPause();
                }
            });

            // Touch support / Swipe gestures for mobile devices
            let touchStartX = 0;
            let touchEndX = 0;

            bookElement.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            bookElement.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                if (touchEndX < touchStartX - 50) {
                    stopAutoPlay();
                    goToPage(currentPageIndex + 1); // Swipe Left -> Next Page
                }
                if (touchEndX > touchStartX + 50) {
                    stopAutoPlay();
                    goToPage(currentPageIndex - 1); // Swipe Right -> Prev Page
                }
            }
        }

        // Initialize application on load
        window.onload = function () {
            preloadImages();
            buildBook();
            initEvents();
        };
    </script>
</body>
</html>
